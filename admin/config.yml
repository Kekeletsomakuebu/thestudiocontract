backend:
  name: git-gateway
  branch: main

# Netlify Identity + Git Gateway handles auth — no tokens to manage.
# No editorial workflow: hitting "Save" in the dashboard commits
# straight to the live site. One step, not two.
media_folder: "assets"
public_folder: "assets"

locale: "en"

# The collections below are ordered and named to match the site's own
# menu, top to bottom: Home, Library (Guides + Articles), Resources,
# Directory, Podcast, Templates, About, Contact.

collections:

  # ---------- HOME ----------
  - name: "home"
    label: "Home"
    files:
      - name: "home"
        label: "Home Page"
        file: "data/home.json"
        editor: { preview: false }
        fields:
          - { label: "Eyebrow (small text above the headline)", name: "kicker", widget: "string" }
          - { label: "Headline", name: "title", widget: "string" }
          - { label: "Paragraph under the headline", name: "lede", widget: "text" }
          - { label: "Hero Photo", name: "hero_photo", widget: "image" }

  # ---------- LIBRARY: GUIDES ----------
  - name: "guides"
    label: "Library — Guides"
    folder: "guides"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Read Time", name: "read_time", widget: "string", hint: "e.g. 8 min" }
      - { label: "Body", name: "body", widget: "markdown" }

  # ---------- LIBRARY: ARTICLES ----------
  - name: "articles"
    label: "Library — Articles"
    folder: "articles"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Status", name: "status", widget: "select", options: ["Developing story", "Confirmed", "Follow-up"] }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Source", name: "source", widget: "string", required: false, hint: "e.g. Strictly Lesotho Music" }
      - { label: "Body", name: "body", widget: "markdown" }

  # ---------- RESOURCES ----------
  - name: "resources"
    label: "Resources"
    folder: "resources"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Copyright", "Publishing", "Royalties", "Beat Licensing", "Distribution", "Music Marketing", "Metadata", "Finance", "Music Law"] }
      - { label: "Body", name: "body", widget: "markdown" }

  # ---------- DIRECTORY ----------
  - name: "directory"
    label: "Directory"
    folder: "directory"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Business / Person Name", name: "name", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Studio", "Producer", "Entertainment Lawyer", "Collection Society", "Radio Station", "Label", "Event"] }
      - { label: "Location (Town/City)", name: "location", widget: "string" }
      - { label: "Photo / Logo", name: "photo", widget: "image", required: false }
      - { label: "Phone", name: "phone", widget: "string", required: false }
      - { label: "Email", name: "email", widget: "string", required: false }
      - { label: "Website", name: "website", widget: "string", required: false }
      - { label: "Short Description", name: "description", widget: "text" }

  # ---------- PODCAST ----------
  - name: "podcast"
    label: "Podcast"
    folder: "podcast"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Episode Title", name: "title", widget: "string" }
      - { label: "Episode Number", name: "episode_number", widget: "number", required: false }
      - { label: "Cover Image", name: "cover", widget: "image", required: false }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Spotify Link", name: "spotify_url", widget: "string", required: false }
      - { label: "YouTube Link", name: "youtube_url", widget: "string", required: false }
      - { label: "Apple Podcasts Link", name: "apple_url", widget: "string", required: false }
      - { label: "Publish Date", name: "date", widget: "datetime" }

  # ---------- TEMPLATES ----------
  - name: "templates"
    label: "Templates"
    folder: "templates_downloads"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Template Name", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "PDF File", name: "file", widget: "file", media_library: { config: { multiple: false } } }
      - { label: "Page Count", name: "pages", widget: "number", required: false }

  # ---------- ABOUT ----------
  - name: "about"
    label: "About"
    files:
      - name: "about"
        label: "About Page"
        file: "data/about.json"
        editor: { preview: false }
        fields:
          - { label: "Headline", name: "heading", widget: "string" }
          - { label: "Body (leave a blank line between paragraphs)", name: "body", widget: "text" }

  # ---------- CONTACT ----------
  - name: "contact"
    label: "Contact"
    files:
      - name: "contact"
        label: "Contact Page"
        file: "data/contact.json"
        editor: { preview: false }
        fields:
          - { label: "Headline", name: "heading", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Instagram handle (without the @)", name: "instagram_handle", widget: "string", required: false }
          - { label: "Phone", name: "phone", widget: "string", required: false }
          - { label: "Location", name: "location", widget: "string" }

  # ---------- GLOBAL SETTINGS ----------
  # Powers the site logo and footer text across every page.
  - name: "settings"
    label: "Global Settings"
    files:
      - name: "site_settings"
        label: "Site Settings"
        file: "data/site-settings.json"
        editor: { preview: false }
        fields:
          - { label: "Site Logo", name: "logo", widget: "image", hint: "Replaces the logo in the header across every page." }
          - { label: "Footer Text", name: "footer_text", widget: "text", hint: "Replaces the copyright/tagline text in the footer across every page." }
